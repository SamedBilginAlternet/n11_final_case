name: n11-final-case

x-postgres-env: &postgres-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-n11}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n11pw}

x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: ${RABBITMQ_USER:-guest}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}

x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PORT: 6379

x-jvm-defaults: &jvm-defaults
  JAVA_TOOL_OPTIONS: "-XX:+UseG1GC -XX:MaxRAMPercentage=75"

# Inject the OTLP collector endpoint into every backend service.  Sampling
# probability stays at 1.0 in dev/demo so every checkout shows up in Jaeger;
# crank down with TRACE_SAMPLING=0.1 in prod when traffic spikes.
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  TRACE_SAMPLING: "${TRACE_SAMPLING:-1.0}"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n11}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n11pw}
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes:
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
      - n11_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n11} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7-alpine
    # AOF every-second so a crash within 1 sec of a write loses at most a
    # few seconds of cache state — fine for cache use; not used as primary store.
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    ports: ["6379:6379"]
    volumes:
      - n11_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 6

  # Distributed tracing UI + OTLP collector. all-in-one image bundles
  # collector + storage + UI into a single container — production would split
  # them, but for one droplet this is enough. Native OTLP-HTTP intake on 4318
  # means we don't need a separate otel-collector sidecar.
  jaeger:
    image: jaegertracing/all-in-one:1.62
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4318:4318"   # OTLP HTTP receiver — services post spans here

  auth-service:
    build:
      context: ./backend
      args:
        SERVICE: auth-service
    image: n11/auth-service:1.0.0
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      <<: [*postgres-env, *rabbitmq-env, *otel-env, *jvm-defaults]
      SERVER_PORT: 8081
      POSTGRES_DB: authdb
      JWT_SECRET: ${JWT_SECRET:-changeme-32-byte-min-secret-changeme-please-rotate}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports: ["8081:8081"]

  product-service:
    build:
      context: ./backend
      args:
        SERVICE: product-service
    image: n11/product-service:1.0.0
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      <<: [*postgres-env, *redis-env, *otel-env, *jvm-defaults]
      SERVER_PORT: 8082
      POSTGRES_DB: productdb
      JWT_SECRET: ${JWT_SECRET:-changeme-32-byte-min-secret-changeme-please-rotate}
    ports: ["8082:8082"]

  cart-service:
    build:
      context: ./backend
      args:
        SERVICE: cart-service
    image: n11/cart-service:1.0.0
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis:    { condition: service_healthy }
      product-service: { condition: service_started }
    environment:
      <<: [*postgres-env, *rabbitmq-env, *redis-env, *otel-env, *jvm-defaults]
      SERVER_PORT: 8083
      POSTGRES_DB: cartdb
      JWT_SECRET: ${JWT_SECRET:-changeme-32-byte-min-secret-changeme-please-rotate}
      PRODUCT_SERVICE_URL: http://product-service:8082
    ports: ["8083:8083"]

  order-service:
    build:
      context: ./backend
      args:
        SERVICE: order-service
    image: n11/order-service:1.0.0
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      cart-service: { condition: service_started }
      auth-service: { condition: service_started }
    environment:
      <<: [*postgres-env, *rabbitmq-env, *otel-env, *jvm-defaults]
      SERVER_PORT: 8084
      POSTGRES_DB: orderdb
      JWT_SECRET: ${JWT_SECRET:-changeme-32-byte-min-secret-changeme-please-rotate}
      CART_SERVICE_URL: http://cart-service:8083
      AUTH_SERVICE_URL: http://auth-service:8081
    ports: ["8084:8084"]

  payment-service:
    build:
      context: ./backend
      args:
        SERVICE: payment-service
    image: n11/payment-service:1.0.0
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      <<: [*postgres-env, *rabbitmq-env, *otel-env, *jvm-defaults]
      SERVER_PORT: 8085
      POSTGRES_DB: paymentdb
      IYZICO_ENABLED: ${IYZICO_ENABLED:-false}
      IYZICO_API_KEY: ${IYZICO_API_KEY:-sandbox-test-key}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY:-sandbox-test-secret}
      IYZICO_BASE_URL: ${IYZICO_BASE_URL:-https://sandbox-api.iyzipay.com}
    ports: ["8085:8085"]

  chatbot-service:
    build:
      context: ./backend
      args:
        SERVICE: chatbot-service
    image: n11/chatbot-service:1.0.0
    depends_on:
      postgres: { condition: service_healthy }
      product-service: { condition: service_started }
    environment:
      <<: [*postgres-env, *otel-env, *jvm-defaults]
      SERVER_PORT: 8087
      POSTGRES_DB: chatbotdb
      CHATBOT_PROVIDER: ${CHATBOT_PROVIDER:-MOCK}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      PRODUCT_SERVICE_URL: http://product-service:8082
    ports: ["8087:8087"]

  api-gateway:
    build:
      context: ./backend
      args:
        SERVICE: api-gateway
    image: n11/api-gateway:1.0.0
    depends_on:
      auth-service: { condition: service_started }
      product-service: { condition: service_started }
      cart-service: { condition: service_started }
      order-service: { condition: service_started }
      payment-service: { condition: service_started }
      chatbot-service: { condition: service_started }
    environment:
      <<: [*jvm-defaults, *otel-env]
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      CART_SERVICE_URL: http://cart-service:8083
      ORDER_SERVICE_URL: http://order-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      CHATBOT_SERVICE_URL: http://chatbot-service:8087
    ports: ["8080:8080"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    image: n11/frontend:1.0.0
    depends_on:
      api-gateway: { condition: service_started }
    ports: ["3000:80"]

volumes:
  n11_pgdata:
  n11_redis_data:
