upstream gateway {
  server api-gateway:8080;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin proxy for /api/* — admin's axios baseURL is empty, every
  # call lands on this nginx and gets forwarded to the gateway.  Keeps
  # CORS off the table for the admin → backend hop.
  location /api/ {
    proxy_pass http://gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
  }

  # SPA fallback: every non-asset path returns index.html so React Router
  # can take over.  Without this, /orders or /products direct-loads
  # would 404 from nginx before the SPA ever boots.
  location / {
    try_files $uri /index.html;
  }
}
