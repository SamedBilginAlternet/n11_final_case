server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:notificationdb}
    username: ${POSTGRES_USER:n11}
    password: ${POSTGRES_PASSWORD:n11pw}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  # Mail sender — env-driven so the same image runs against MailHog (local
  # dev), Mailtrap sandbox (staging), or Resend SMTP (production).
  # MailHog needs no auth; Resend requires the literal username "resend"
  # and an API key as password — auth + STARTTLS toggles handle both.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:false}
  thymeleaf:
    prefix: classpath:/templates/mail/
    suffix: .html
    cache: ${THYMELEAF_CACHE:true}

n11:
  notification:
    from-address: ${MAIL_FROM_ADDRESS:no-reply@n11.local}
    from-name: ${MAIL_FROM_NAME:n11 Sipariş}
    storefront-url: ${STOREFRONT_URL:http://localhost:3000}
    admin-panel-url: ${ADMIN_PANEL_URL:http://localhost:3001}
    # Empty by default — set via env when low-stock alerts are activated
    # in product-service.  Listener skips sending if blank.
    admin-alert-recipient: ${ADMIN_ALERT_RECIPIENT:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
