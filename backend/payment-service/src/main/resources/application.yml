server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:paymentdb}?stringtype=unspecified
    username: ${POSTGRES_USER:n11}
    password: ${POSTGRES_PASSWORD:n11pw}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

n11:
  jwt:
    secret: ${JWT_SECRET:dev-only-please-change-32-byte-secret-1234567890}
    issuer: n11-auth
  iyzico:
    enabled: ${IYZICO_ENABLED:false}
    api-key: ${IYZICO_API_KEY:sandbox-test-key}
    secret-key: ${IYZICO_SECRET_KEY:sandbox-test-secret}
    base-url: ${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}
    failure:
      simulate: ${PAYMENT_SIMULATE_FAILURE:false}
      rate: ${PAYMENT_FAILURE_RATE:0.0}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

sentry:
  # Boş DSN -> SDK no-op olur (local dev / CI sessiz).  Production'da
  # SENTRY_DSN Infisical'dan iner.  Tracing Jaeger'da kaldığı için
  # traces-sample-rate=0 — Sentry sadece exception ve ERROR-level log
  # event'leri yakalar.
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:dev}
  send-default-pii: false
  traces-sample-rate: 0.0
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info
  tags:
    service: payment-service
