server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: order-service
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:orderdb}?stringtype=unspecified
    username: ${POSTGRES_USER:n11}
    password: ${POSTGRES_PASSWORD:n11pw}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

n11:
  jwt:
    secret: ${JWT_SECRET:dev-only-please-change-32-byte-secret-1234567890}
    issuer: n11-auth
  services:
    cart-base-url: ${CART_SERVICE_URL:http://localhost:8083}
    auth-base-url: ${AUTH_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

sentry:
  # Boş DSN -> SDK no-op olur (local dev / CI sessiz).  Production'da
  # SENTRY_DSN Infisical'dan iner.  Tracing Jaeger'da kaldığı için
  # traces-sample-rate=0 — Sentry sadece exception ve ERROR-level log
  # event'leri yakalar.
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:dev}
  send-default-pii: false
  traces-sample-rate: 0.0
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info
  tags:
    service: order-service
