server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: product-service
  servlet:
    multipart:
      # 5 MB per file matches ProductImageService.MAX_BYTES.  Spring's
      # default 1 MB would 413 every JPEG over 1 MB before our service
      # validation even runs, so the user would see a useless error.
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    web:
      pageable:
        # Hard cap so '?size=99999' can't sweep the whole table into JVM heap.
        # 100 is generous for a UI grid; UI default stays 20 via @PageableDefault.
        max-page-size: 100
        default-page-size: 20
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:productdb}?stringtype=unspecified
    username: ${POSTGRES_USER:n11}
    password: ${POSTGRES_PASSWORD:n11pw}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  cache:
    type: redis
    redis:
      time-to-live: 5m
      cache-null-values: false
      # Surface cache hit/miss/put counts to Micrometer → /actuator/metrics/cache.gets
      enable-statistics: true
      # NB: spring.cache.redis.key-prefix is intentionally absent — we build a
      # custom RedisCacheManager (CacheConfig) and apply the prefix via
      # computePrefixWith(), which honours n11.cache.schema-version below.
      # Setting it here would be silently ignored and confuse future readers.

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

springdoc:
  swagger-ui:
    path: /swagger-ui.html

storage:
  # S3 / MinIO config.  Empty endpoint disables wiring (S3Config gated on
  # storage.s3.endpoint), so a local dev stack without MinIO still boots
  # — ProductImageService just rejects upload calls.  Bucket has anonymous
  # read; service-account creds (S3_ACCESS_KEY / S3_SECRET_KEY) are
  # generated by infra/digitalocean/scripts/bootstrap-minio.sh and stored
  # in Infisical.  publicBaseUrl is what the browser sees; endpoint is
  # internal and only the SDK touches it.
  s3:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    bucket: ${S3_BUCKET:n11-products}
    public-base-url: ${S3_PUBLIC_BASE_URL:}

n11:
  cache:
    # Bump when cache value shape changes (DTO field added/removed, serializer
    # rewired) so old entries orphan and TTL-evict.  See docs/caching.md.
    schema-version: ${CACHE_SCHEMA_VERSION:1}
  jwt:
    secret: ${JWT_SECRET:dev-only-please-change-32-byte-secret-1234567890}
    issuer: n11-auth
  recommendations:
    enabled: ${RECOMMENDATIONS_ENABLED:true}
    groq:
      # Free tier rate-limited to ~30 req/min on the 8b-instant model.  With
      # the 5-minute Redis cache on /recommendations a popular product can
      # absorb ~3000 visits/hr on a single Groq call.
      api-key: ${GROQ_API_KEY:}
      base-url: ${GROQ_BASE_URL:https://api.groq.com}
      model: ${GROQ_RECOMMENDATIONS_MODEL:llama-3.1-8b-instant}
      max-tokens: 600
      temperature: 0.4
      timeout-seconds: 8
    order-service:
      base-url: ${ORDER_SERVICE_URL:http://localhost:8084}
      timeout-seconds: 3
  inventory:
    low-stock:
      # Disabled by default so a fresh dev stack doesn't blast a mail on
      # first compose-up.  Set LOW_STOCK_ALERTS_ENABLED=true to activate.
      enabled: ${LOW_STOCK_ALERTS_ENABLED:false}
      threshold: ${LOW_STOCK_THRESHOLD:5}
      max-items-per-report: ${LOW_STOCK_MAX_ITEMS:50}
      cron: ${LOW_STOCK_CRON:0 0 9 * * *}

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
  level:
    root: INFO
    com.n11: DEBUG

sentry:
  # Boş DSN -> SDK no-op olur (local dev / CI sessiz).  Production'da
  # SENTRY_DSN Infisical'dan iner.  Tracing Jaeger'da kaldığı için
  # traces-sample-rate=0 — Sentry sadece exception ve ERROR-level log
  # event'leri yakalar.
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:dev}
  send-default-pii: false
  traces-sample-rate: 0.0
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info
  tags:
    service: product-service

internal:
  # Shared bearer token for service-to-service stock saga calls.  Both
  # product-service and order-service read it from the env so the value
  # is owned by Infisical and rotates without code changes.
  api-token: ${INTERNAL_API_TOKEN:}
