server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: product-service
  data:
    web:
      pageable:
        # Hard cap so '?size=99999' can't sweep the whole table into JVM heap.
        # 100 is generous for a UI grid; UI default stays 20 via @PageableDefault.
        max-page-size: 100
        default-page-size: 20
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:productdb}?stringtype=unspecified
    username: ${POSTGRES_USER:n11}
    password: ${POSTGRES_PASSWORD:n11pw}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  cache:
    type: redis
    redis:
      time-to-live: 5m
      cache-null-values: false
      use-key-prefix: true
      key-prefix: "product:"
      # Surface cache hit/miss/put counts to Micrometer → /actuator/metrics/cache.gets
      enable-statistics: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

n11:
  jwt:
    secret: ${JWT_SECRET:dev-only-please-change-32-byte-secret-1234567890}
    issuer: n11-auth

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
  level:
    root: INFO
    com.n11: DEBUG
