server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        cors-configurations:
          '[/**]':
            # 'allowedOriginPatterns: *' WITH allowCredentials=true was a hole:
            # Spring's pattern-matching variant accepts any origin under that
            # wildcard *and* sends Allow-Credentials, so attacker.com could
            # cross-fetch our API with the victim's cookies/auth state.
            # Now: explicit origin list, env-overridable for prod (set
            # CORS_ALLOWED_ORIGINS=https://yourdomain.com,https://www.yourdomain.com).
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
            allowedMethods: GET,POST,PUT,PATCH,DELETE,OPTIONS
            allowedHeaders: Authorization,Content-Type,X-Correlation-Id,X-Guest-Token
            exposedHeaders: X-Correlation-Id,Retry-After
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: auth
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**,/api/users/**,/api/addresses/**

        - id: products
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/products/**,/api/categories/**

        - id: cart
          uri: ${CART_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/cart/**,/api/wishlist/**

        - id: orders
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/orders/**

        - id: payments
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/payments/**

        - id: chatbot
          uri: ${CHATBOT_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/chat/**

        - id: auth-docs
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/aggregated-docs/auth
          filters:
            - SetPath=/v3/api-docs

        - id: product-docs
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/aggregated-docs/products
          filters:
            - SetPath=/v3/api-docs

        - id: cart-docs
          uri: ${CART_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/aggregated-docs/cart
          filters:
            - SetPath=/v3/api-docs

        - id: order-docs
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/aggregated-docs/orders
          filters:
            - SetPath=/v3/api-docs

        - id: payment-docs
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/aggregated-docs/payments
          filters:
            - SetPath=/v3/api-docs

        - id: chatbot-docs
          uri: ${CHATBOT_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/aggregated-docs/chatbot
          filters:
            - SetPath=/v3/api-docs

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: auth
        url: /aggregated-docs/auth
      - name: products
        url: /aggregated-docs/products
      - name: cart
        url: /aggregated-docs/cart
      - name: orders
        url: /aggregated-docs/orders
      - name: payments
        url: /aggregated-docs/payments
      - name: chatbot
        url: /aggregated-docs/chatbot

management:
  endpoints:
    web:
      exposure:
        # Tightened: 'gateway' previously exposed the full route table —
        # downstream service URLs, predicates, filters, internal topology
        # leaked to anyone who could hit the gateway publicly. 'metrics'
        # likewise dumps JVM + per-route counters that belong on an
        # internal Prometheus scrape, not the public surface.
        # Override via MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE on the
        # ops box if you need them temporarily.
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
