server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: chatbot-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:chatbotdb}?stringtype=unspecified
    username: ${POSTGRES_USER:n11}
    password: ${POSTGRES_PASSWORD:n11pw}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

n11:
  chatbot:
    provider: ${CHATBOT_PROVIDER:MOCK}
    rate-limit:
      capacity: ${CHAT_RATE_CAPACITY:20}
      window-seconds: ${CHAT_RATE_WINDOW_SECONDS:60}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
      max-tokens: ${ANTHROPIC_MAX_TOKENS:512}
      timeout-seconds: 20
    groq:
      api-key: ${GROQ_API_KEY:}
      base-url: ${GROQ_BASE_URL:https://api.groq.com}
      model: ${GROQ_MODEL:llama-3.3-70b-versatile}
      max-tokens: ${GROQ_MAX_TOKENS:512}
      temperature: ${GROQ_TEMPERATURE:0.7}
      timeout-seconds: 20
    catalog:
      product-base-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

sentry:
  # Boş DSN -> SDK no-op olur (local dev / CI sessiz).  Production'da
  # SENTRY_DSN Infisical'dan iner.  Tracing Jaeger'da kaldığı için
  # traces-sample-rate=0 — Sentry sadece exception ve ERROR-level log
  # event'leri yakalar.
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:dev}
  send-default-pii: false
  traces-sample-rate: 0.0
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info
  tags:
    service: chatbot-service
