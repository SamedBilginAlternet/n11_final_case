server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:authdb}?stringtype=unspecified
    username: ${POSTGRES_USER:n11}
    password: ${POSTGRES_PASSWORD:n11pw}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

n11:
  jwt:
    secret: ${JWT_SECRET:dev-only-please-change-32-byte-secret-1234567890}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MIN:60}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
    issuer: n11-auth
  auth:
    # Refresh-token cookie attributes.  HttpOnly is forced in code; these are
    # the user-tunable bits.  In dev (HTTP) set AUTH_COOKIE_SECURE=false so
    # Chrome will accept and resend the cookie on http://localhost.
    cookie:
      name: ${AUTH_COOKIE_NAME:n11_refresh}
      path: ${AUTH_COOKIE_PATH:/api/auth}
      same-site: ${AUTH_COOKIE_SAMESITE:Lax}
      secure: ${AUTH_COOKIE_SECURE:true}
      domain: ${AUTH_COOKIE_DOMAIN:}
  social-login:
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    success-path: /auth/callback
    failure-path: /login
    # Default uses {baseUrl} (derived from request scheme/host) — fine for local
    # dev. In prod, set OAUTH2_REDIRECT_URI_TEMPLATE to an explicit https URL so
    # we don't depend on X-Forwarded-Proto surviving every proxy hop.
    redirect-uri-template: ${OAUTH2_REDIRECT_URI_TEMPLATE:{baseUrl}/api/auth/oauth2/callback/{registrationId}}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  firebase:
    # Multi-line JSON pulled from Infisical.  When blank, FirebaseConfig
    # short-circuits and the /api/auth/login/phone endpoint returns 401.
    service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
  level:
    root: INFO
    com.n11: DEBUG
