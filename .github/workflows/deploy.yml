name: deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Override image tag (defaults to commit SHA)'
        required: false

env:
  GHCR_OWNER: ${{ github.repository_owner }}

jobs:
  build-images:
    name: Build & push images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG="${GITHUB_SHA::7}"
          fi
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building tag: $TAG"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend services via Jib
        working-directory: backend
        env:
          OWNER_LC: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          OWNER_LC=$(echo "$OWNER_LC" | tr '[:upper:]' '[:lower:]')
          for svc in api-gateway auth-service product-service cart-service order-service payment-service notification-service chatbot-service; do
            mvn -B -DskipTests -pl "$svc" -am package
            mvn -B -DskipTests -pl "$svc" \
              -Djib.to.image=ghcr.io/${OWNER_LC}/${svc}:${IMAGE_TAG} \
              -Djib.to.tags=latest \
              jib:build
          done

      - name: Build & push frontend image
        working-directory: frontend
        env:
          OWNER_LC: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          OWNER_LC=$(echo "$OWNER_LC" | tr '[:upper:]' '[:lower:]')
          docker build --build-arg VITE_API_BASE_URL=/api \
            -t ghcr.io/${OWNER_LC}/frontend:${IMAGE_TAG} \
            -t ghcr.io/${OWNER_LC}/frontend:latest .
          docker push ghcr.io/${OWNER_LC}/frontend:${IMAGE_TAG}
          docker push ghcr.io/${OWNER_LC}/frontend:latest

  deploy-droplet:
    name: Deploy to DigitalOcean droplet
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - name: Check droplet credentials
        id: check
        env:
          HOST: ${{ secrets.DO_DROPLET_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "DO_DROPLET_HOST not configured — skipping deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'

      - name: Sync infra files to droplet
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_DROPLET_HOST }}
          username: ${{ secrets.DO_DROPLET_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: "infra/digitalocean/docker-compose.prod.yml,infra/digitalocean/Caddyfile,infra/digitalocean/postgres-init/*"
          target: "/opt/n11"
          strip_components: 2

      - name: Pull & restart on droplet
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build-images.outputs.image_tag }}
        with:
          host: ${{ secrets.DO_DROPLET_HOST }}
          username: ${{ secrets.DO_DROPLET_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -euo pipefail
            cd /opt/n11
            chmod +x postgres-init/*.sh || true
            export IMAGE_TAG="$IMAGE_TAG"
            if grep -q "^IMAGE_TAG=" .env 2>/dev/null; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$IMAGE_TAG|" .env
            else
              echo "IMAGE_TAG=$IMAGE_TAG" >> .env
            fi
            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GHCR_OWNER:-deploy}" --password-stdin
            fi
            docker compose -f docker-compose.prod.yml --env-file .env pull
            docker compose -f docker-compose.prod.yml --env-file .env up -d --remove-orphans
            docker image prune -f

  notify:
    name: Slack notify
    needs: [build-images, deploy-droplet]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Post to Slack
        env:
          BUILD_STATUS: ${{ needs.build-images.result }}
          DEPLOY_STATUS: ${{ needs.deploy-droplet.result }}
          IMAGE_TAG: ${{ needs.build-images.outputs.image_tag }}
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "SLACK_WEBHOOK_URL not configured — skipping"
            exit 0
          fi

          if [ "$DEPLOY_STATUS" = "success" ]; then
            EMOJI=":rocket:"
            HEADER="Deploy OK"
            COLOR="good"
          elif [ "$DEPLOY_STATUS" = "skipped" ] && [ "$BUILD_STATUS" = "success" ]; then
            EMOJI=":package:"
            HEADER="Images pushed (droplet not configured)"
            COLOR="good"
          else
            EMOJI=":x:"
            HEADER="Deploy FAILED"
            COLOR="danger"
          fi

          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          RUN_URL="${REPO_URL}/actions/runs/${GITHUB_RUN_ID}"

          curl -sS -X POST -H 'Content-type: application/json' --data @- "$WEBHOOK" <<EOF
          {
            "attachments": [{
              "color": "$COLOR",
              "blocks": [
                { "type": "header", "text": { "type": "plain_text", "text": "$EMOJI n11-final-case — $HEADER" } },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Tag:*\n\`$IMAGE_TAG\`" },
                    { "type": "mrkdwn", "text": "*Ref:*\n\`${GITHUB_REF_NAME}\`" },
                    { "type": "mrkdwn", "text": "*Build:*\n$BUILD_STATUS" },
                    { "type": "mrkdwn", "text": "*Deploy:*\n$DEPLOY_STATUS" }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    { "type": "mrkdwn", "text": "<$RUN_URL|Run #${GITHUB_RUN_NUMBER}> · <${REPO_URL}/commit/${GITHUB_SHA}|${GITHUB_SHA:0:7}> · ${GITHUB_ACTOR}" }
                  ]
                }
              ]
            }]
          }
          EOF
