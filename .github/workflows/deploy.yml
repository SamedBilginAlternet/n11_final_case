name: deploy

on:
  push:
    branches: [main]
    tags: ['v*']
    # Doc-only commits (README, docs/, *.md) shouldn't trigger a 6-min
    # rebuild of 10 images.  Anything that affects the actual artifacts
    # (backend code, frontend code, infra/compose, this workflow) still
    # falls through and triggers the full pipeline.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'http/**'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Override image tag (defaults to commit SHA)'
        required: false

env:
  GHCR_OWNER: ${{ github.repository_owner }}

jobs:
  meta:
    name: Compute image tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      owner_lc: ${{ steps.tag.outputs.owner_lc }}
    steps:
      - id: tag
        env:
          OVERRIDE_TAG: ${{ inputs.image_tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$OVERRIDE_TAG" ]; then
            TAG="$OVERRIDE_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG="${GITHUB_SHA::7}"
          fi
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "owner_lc=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "Building tag: $TAG"

  build-backend:
    name: jib ${{ matrix.service }}
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Don't cancel sibling builds on a single-service failure — we still
      # want to know which services compile cleanly.
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - product-service
          - cart-service
          - order-service
          - payment-service
          - chatbot-service
          - notification-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install parent pom + common to local m2
        working-directory: backend
        # Two-pass build because Maven applies the `jib:build` goal to every
        # module selected by `-am`, including `common` — which is a library
        # without a main class, so Jib fails on it.  We pre-populate ~/.m2:
        #   - `mvn -N install` installs ONLY the aggregator pom (no recurse).
        #     Without this, common's pom references parent and the second
        #     pass fails with `Could not find artifact n11-final-case-parent`.
        #   - `mvn -pl common install` then installs common.jar.
        # The per-service `jib:build` invocation below resolves both from
        # the local repo without needing `-am` (which would re-trigger the
        # original "jib on common" bug).
        run: |
          mvn -B -N install
          mvn -B -pl common -DskipTests install

      - name: Build & push ${{ matrix.service }}
        working-directory: backend
        env:
          OWNER_LC: ${{ needs.meta.outputs.owner_lc }}
          IMAGE_TAG: ${{ needs.meta.outputs.image_tag }}
          SVC: ${{ matrix.service }}
        run: |
          # No -am here — we already installed common in the previous step,
          # so this invocation operates on a single module and won't try to
          # apply jib:build to library modules.  Parallel layer uploads
          # (no -Djib.serialize=true) — the 3-attempt retry mops up GHCR's
          # occasional BLOB_UPLOAD_UNKNOWN race.  httpTimeout=60000 keeps
          # slow GHCR responses from looking like connection drops.
          attempt=1
          max_attempts=3
          while [ $attempt -le $max_attempts ]; do
            if mvn -B -pl "$SVC" -DskipTests package \
                -Djib.to.image=ghcr.io/${OWNER_LC}/${SVC}:${IMAGE_TAG} \
                -Djib.to.tags=latest \
                -Djib.httpTimeout=60000 \
                -Djib.console=plain \
                jib:build; then
              exit 0
            fi
            echo "::warning::jib:build failed for $SVC (attempt $attempt/$max_attempts), retrying in 15s..."
            attempt=$((attempt+1))
            sleep 15
          done
          echo "::error::jib:build failed for $SVC after $max_attempts attempts"
          exit 1

  build-frontend:
    name: docker ${{ matrix.image }}
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: frontend
            workdir: frontend
            api_base: /api
          - image: frontend-admin
            workdir: frontend-admin
            # Empty VITE_API_BASE_URL → axios calls land on same-origin
            # /api/*, which the admin's nginx wrapper proxies to gateway.
            api_base: ''
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.workdir }}
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ matrix.api_base }}
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_SENTRY_ENVIRONMENT=production
            VITE_SENTRY_RELEASE=${{ needs.meta.outputs.image_tag }}
            VITE_APP_VERSION=${{ needs.meta.outputs.image_tag }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: |
            ghcr.io/${{ needs.meta.outputs.owner_lc }}/${{ matrix.image }}:${{ needs.meta.outputs.image_tag }}
            ghcr.io/${{ needs.meta.outputs.owner_lc }}/${{ matrix.image }}:latest
          # GHA cache cuts npm install + vite build to seconds on warm runs.
          # Per-image scope keeps frontend / frontend-admin caches isolated.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy-droplet:
    name: Deploy to DigitalOcean droplet
    needs: [meta, build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check droplet credentials
        id: check
        env:
          HOST: ${{ secrets.DO_DROPLET_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "DO_DROPLET_HOST not configured — skipping deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'

      - name: Sync infra files to droplet
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_DROPLET_HOST }}
          username: ${{ secrets.DO_DROPLET_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: "infra/digitalocean/docker-compose.prod.yml,infra/digitalocean/Caddyfile,infra/digitalocean/sync-env.sh,infra/digitalocean/postgres-init/*,infra/digitalocean/scripts/*"
          target: "/opt/n11"
          strip_components: 2

      - name: Pull & restart on droplet
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.meta.outputs.image_tag }}
        with:
          host: ${{ secrets.DO_DROPLET_HOST }}
          username: ${{ secrets.DO_DROPLET_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -euo pipefail
            cd /opt/n11
            chmod +x postgres-init/*.sh || true
            chmod +x sync-env.sh 2>/dev/null || true
            # Pull the latest .env from Infisical before deploy so secret edits
            # in the Infisical UI flow through CI without manual SSH.  If the
            # sync script isn't present (older droplets / first run), fall
            # through and use whatever .env already exists.
            if [ -x ./sync-env.sh ]; then
              ./sync-env.sh
            else
              echo "::warning::sync-env.sh missing on droplet, using existing .env"
            fi
            export IMAGE_TAG="$IMAGE_TAG"
            if grep -q "^IMAGE_TAG=" .env 2>/dev/null; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$IMAGE_TAG|" .env
            else
              echo "IMAGE_TAG=$IMAGE_TAG" >> .env
            fi
            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GHCR_OWNER:-deploy}" --password-stdin
            fi
            docker compose -f docker-compose.prod.yml --env-file .env pull
            docker compose -f docker-compose.prod.yml --env-file .env up -d --remove-orphans
            # Self-heal MinIO product images (idempotent — uploads only what's
            # missing) so a fresh/wiped object store repopulates with no manual
            # SSH. Non-fatal: a failure here never blocks the deploy.
            if [ -f ./scripts/restore-product-images.sh ]; then
              bash ./scripts/restore-product-images.sh || echo "::warning::image restore failed (non-fatal)"
            fi
            # Caddyfile is bind-mounted, so the previous `caddy reload` approach
            # silently re-read whatever was on disk — if the SCP step had
            # delivered a stale file, the reload "succeeded" with the wrong
            # routes and we'd only notice in production.  Now we:
            #   1) Echo the deployed Caddyfile's @api matcher line so the
            #      deploy log proves what's actually on the droplet.
            #   2) Force-recreate the caddy container, which re-reads the
            #      bind-mount from scratch (no chance of cached config).
            #   3) Validate Caddy is healthy after recreate.
            echo "::group::Caddyfile @api matcher on droplet"
            grep -n '^\s*@api' Caddyfile || echo "::error::no @api matcher found in /opt/n11/Caddyfile"
            echo "::endgroup::"
            docker compose -f docker-compose.prod.yml --env-file .env up -d --force-recreate caddy
            sleep 3
            docker compose -f docker-compose.prod.yml --env-file .env ps caddy
            docker image prune -f

  notify:
    name: Slack notify
    needs: [meta, build-backend, build-frontend, deploy-droplet]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Post to Slack
        env:
          BACKEND_STATUS: ${{ needs.build-backend.result }}
          FRONTEND_STATUS: ${{ needs.build-frontend.result }}
          DEPLOY_STATUS: ${{ needs.deploy-droplet.result }}
          IMAGE_TAG: ${{ needs.meta.outputs.image_tag }}
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "SLACK_WEBHOOK_URL not configured — skipping"
            exit 0
          fi

          if [ "$BACKEND_STATUS" = "success" ] && [ "$FRONTEND_STATUS" = "success" ]; then
            BUILD_STATUS="success"
          else
            BUILD_STATUS="failure"
          fi

          if [ "$DEPLOY_STATUS" = "success" ]; then
            EMOJI=":rocket:"
            HEADER="Deploy OK"
            COLOR="good"
          elif [ "$DEPLOY_STATUS" = "skipped" ] && [ "$BUILD_STATUS" = "success" ]; then
            EMOJI=":package:"
            HEADER="Images pushed (droplet not configured)"
            COLOR="good"
          else
            EMOJI=":x:"
            HEADER="Deploy FAILED"
            COLOR="danger"
          fi

          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          RUN_URL="${REPO_URL}/actions/runs/${GITHUB_RUN_ID}"

          curl -sS -X POST -H 'Content-type: application/json' --data @- "$WEBHOOK" <<EOF
          {
            "attachments": [{
              "color": "$COLOR",
              "blocks": [
                { "type": "header", "text": { "type": "plain_text", "text": "$EMOJI n11-final-case — $HEADER" } },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Tag:*\n\`$IMAGE_TAG\`" },
                    { "type": "mrkdwn", "text": "*Ref:*\n\`${GITHUB_REF_NAME}\`" },
                    { "type": "mrkdwn", "text": "*Build:*\n$BUILD_STATUS" },
                    { "type": "mrkdwn", "text": "*Deploy:*\n$DEPLOY_STATUS" }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    { "type": "mrkdwn", "text": "<$RUN_URL|Run #${GITHUB_RUN_NUMBER}> · <${REPO_URL}/commit/${GITHUB_SHA}|${GITHUB_SHA:0:7}> · ${GITHUB_ACTOR}" }
                  ]
                }
              ]
            }]
          }
          EOF
