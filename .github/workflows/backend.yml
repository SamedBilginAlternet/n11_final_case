name: backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    name: ${{ matrix.module }} — verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - common
          - api-gateway
          - auth-service
          - product-service
          - cart-service
          - order-service
          - payment-service
          - notification-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build & test ${{ matrix.module }}
        working-directory: backend
        run: mvn -B -pl ${{ matrix.module }} -am verify

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.module }}
          path: backend/${{ matrix.module }}/target/surefire-reports
          retention-days: 7

  build-images:
    name: jib build images
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, auth-service, product-service, cart-service, order-service, payment-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Jib build & push
        working-directory: backend
        run: |
          mvn -B -DskipTests -pl ${{ matrix.service }} -am package
          mvn -B -DskipTests -pl ${{ matrix.service }} \
            -Djib.to.image=ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }} \
            -Djib.to.tags=latest \
            jib:build
